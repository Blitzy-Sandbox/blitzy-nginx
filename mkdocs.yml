site_name: 'blitzy-nginx'
nav:
  - Home: index.md
  - API Reference:
      - Status Code API: api/status_codes.md
  - Migration Guide:
      - Status Code API Migration: migration/status_code_api.md
  - Refactor:
      - Decision Log: refactor/decision_log.md
      - Traceability Matrix: refactor/traceability_matrix.md
  - Observability:
      - Overview: observability/observability.md
exclude_docs: |
  html/
  xml/
  dtd/
  xslt/
  xsls/
  man/
  GNUmakefile
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
plugins:
  - techdocs-core
  - mermaid2
